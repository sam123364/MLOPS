[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "rainwater-yield-kolar"
version = "0.1.0"
description = "MLOps pipeline for rainwater yield estimation in Eastern Karnataka"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

authors = [
  {name = "Team Kolar MLOps"}
]

keywords = ["mlops", "hydrology", "rainfall", "karnataka", "gis", "remote-sensing"]

dependencies = [
  # ── Data versioning & experiment tracking ──
  "dvc>=3.55",
  "mlflow>=2.17",

  # ── Configuration ──
  "pyyaml>=6.0",

  # ── Geospatial core ──
  "rasterio>=1.4",
  "rioxarray>=0.17",
  "shapely>=2.0",
  "pyproj>=3.6",
  "fiona>=1.10",
  "geopandas>=1.0",

  # ── Raster/array ──
  "numpy>=1.26",
  "scipy>=1.13",
  "xarray>=2024.7",
  "netCDF4>=1.7",
  "h5py>=3.11",

  # ── Rainfall ──
  "imdlib>=0.3.1",         # IMD 0.25° binary rainfall reader

  # ── Hydrology / terrain ──
  "pysheds>=0.5",           # D8 flow direction & accumulation

  # ── Data manipulation ──
  "pandas>=2.2",
  "joblib>=1.4",

  # ── ML ──
  "scikit-learn>=1.5",

  # ── HTTP / API clients ──
  "requests>=2.32",
  "httpx>=0.27",

  # ── Visualization ──
  "matplotlib>=3.9",
  "seaborn>=0.13",
  "folium>=0.17",           # interactive HTML maps
]

[project.optional-dependencies]
sentinel = [
  "eodag>=4.9",             # Sentinel-2 download from Copernicus Dataspace
  "sentinelhub>=3.10",      # Copernicus Process API for on-the-fly chips
  "spyndex>=0.0.7",         # Spectral indices (NDVI, NDWI, EVI)
]
et = [
  "pyeto>=0.1",             # FAO-56 ET0 helper (optional supplement)
]
deep = [
  "torch>=2.3",
  "torchgeo>=0.6",
]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "black>=24.0",
  "ruff>=0.5",
  "pre-commit>=3.7",
  "ipykernel>=6.29",
  "jupyterlab>=4.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310", "py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
